services:
  laravel:
    build:
      context: .
      dockerfile: dockerfile.dev
    working_dir: /app
    ports:
      - "8000:8000"
      - "5173:5173" 
    volumes:
     - ./laravel:/app
     - /app/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=POSdatabase
      - DB_USERNAME=admin
      - DB_PASSWORD=123456789
    depends_on:
      - mysql
    command: sleep infinity

  mysql:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: POSdatabase
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456789
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: